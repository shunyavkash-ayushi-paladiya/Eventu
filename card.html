<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Card Layout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1000px;
      width: 100%;
    }

    .card-container {
      flex: 1 1 60%;
      border-radius: 16px;
      overflow: hidden;
    }

    .card-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
    }

    .cta-container {
      flex: 1 1 35%;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      color: white;
    }

    .cta-container::before {
      content: "";
      background: url('ddcb7026-742e-4a11-81a5-ed58afdf0519.png') no-repeat center center / cover;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      filter: brightness(0.9);
    }

    .cta-content {
      position: relative;
      z-index: 1;
    }

    .cta-content h4 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #cde9ff;
    }

    .cta-content p {
      font-size: 14px;
      margin-bottom: 20px;
      color: #e0e0e0;
    }

    .cta-content button {
      background-color: #00d39e;
      color: black;
      padding: 12px 20px;
      font-size: 14px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .cta-content button:hover {
      background-color: #00b88b;
    }

    @media (max-width: 768px) {
      .wrapper {
        flex-direction: column;
      }

      .card-container, .cta-container {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- Left: Card Image -->
    <div class="card-container">
      <img src="assests/images/logo/card-1.png" alt="Business Card Image" />
    </div>

    <!-- Right: CTA with background -->
    <div class="cta-container">
      <div class="cta-content">
        <h4>Boost your spending power</h4>
        <p>Only pay for what you use, no matter the amount you got approved for.</p>
        <button>Get Started →</button>
      </div>
    </div>
  </div>
</body>
</html>
